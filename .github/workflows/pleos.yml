name: Pleos Connect emulator check

# ci-pleos 브랜치에 올리거나 수동으로 실행하면, Pleos Connect 에뮬레이터(공식 SDK Update Site 의 시스템 이미지)를
# 내려받아 부팅하고 apk/ 의 release APK 를 설치·실행한 뒤 화면과 로그를 ci-pleos-out 브랜치에 저장합니다.
on:
  push:
    branches: [ ci-pleos ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pleos:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h / | tail -1

      - name: Install Pleos Connect system image
        run: bash scripts/ci/pleos_setup.sh

      - name: Boot emulator and run the app
        run: bash scripts/ci/pleos_run.sh

      - name: Publish outputs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pleos"
          cd "$RUNNER_TEMP/pleos"
          ls -la
          git init -q -b ci-pleos-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "pleos emulator outputs (run ${GITHUB_RUN_NUMBER})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-pleos-out
