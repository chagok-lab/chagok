name: SDK API check

on:
  push:
    branches: [ ci-sdk ]

permissions:
  contents: write

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Print SDK public API
        run: bash scripts/ci/sdk_api.sh
      - name: Publish outputs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/sdk"
          cd "$RUNNER_TEMP/sdk"
          git init -q -b ci-sdk-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "sdk api outputs (run ${GITHUB_RUN_NUMBER})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-sdk-out
