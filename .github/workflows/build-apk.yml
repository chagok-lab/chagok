name: Build release APK

# main 에 소스가 올라오면 단위 테스트와 release 빌드를 실행하고,
# 만들어진 APK 를 apk/차곡_release.apk 로 저장소에 올립니다.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'apk/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unit tests and release build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Count unit tests
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import glob
          import xml.etree.ElementTree as ET
          total = failed = 0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root = ET.parse(path).getroot()
              total += int(root.get('tests', 0))
              failed += int(root.get('failures', 0)) + int(root.get('errors', 0))
          print(f"TEST_TOTAL={total}")
          print(f"TEST_FAILED={failed}")
          PY

      - name: Publish APK to apk/
        run: |
          cp app/build/outputs/apk/release/app-release.apk "apk/차곡_release.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apk/차곡_release.apk"
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "release APK 갱신 (GitHub Actions 빌드 #${GITHUB_RUN_NUMBER}, 단위 테스트 ${TEST_TOTAL}개 중 실패 ${TEST_FAILED}개)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Save build log when something failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/cilog"
          cd "$RUNNER_TEMP/cilog"
          cp "$RUNNER_TEMP/build.log" build.log 2>/dev/null || echo "no build log" > build.log
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.log
          git commit -q -m "CI build log (run ${GITHUB_RUN_NUMBER})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
